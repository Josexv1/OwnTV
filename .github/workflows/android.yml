name: Android CI

# Two jobs:
#   check — unit tests + lint. Runs on everything, including pull requests. Gates the build.
#   build — assembles the APK, and publishes a GitHub Release on v* tags. Never runs for a PR, so
#           PR branches still don't produce APKs (the restriction added in ac33c65 is unchanged);
#           they only get the test/lint verdict.
on:
  # Deliberately NOT on push to main. Tests, lint and the release build all run locally in this
  # fork, so a runner per commit only duplicates a verdict already in hand and delays it by ~16
  # minutes. What a runner is actually needed for is cutting a release: a clean checkout, the
  # signing secrets, and both ABI flavors. Add `branches: [ main ]` back if that ever changes.
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_debug:
        description: "Build a debug-signed APK even if release signing secrets are configured"
        type: boolean
        default: false

permissions:
  contents: write   # required so tag builds can create a Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing was checking the unit tests or lint before, so both could rot silently while the APK
  # kept building. This job is the gate: if it is red, no APK is produced and no release is cut.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # One variant, not `test`/`lint` across every flavor: standard+debug is the variant the JVM
      # tests are written against, and the ABI flavors differ only in the packaged native libs.
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest --stacktrace

      # abortOnError = true in app/build.gradle.kts, so this fails the job on a lint error.
      - name: Lint
        if: always()   # report both verdicts in one run instead of one failure at a time
        run: ./gradlew lintStandardDebug --stacktrace

      - name: Upload test and lint reports
        if: always()   # the reports matter most when the step above failed
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn

  build:
    needs: check
    # PRs get the check job only — no APK, no release. Unchanged from ac33c65.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Set at runtime via $GITHUB_ENV in the "Name the APK" step. Declared here (empty) so static
      # linters don't flag the later ${{ env.APK_OUT }} references as "context access might be invalid".
      APK_OUT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'   # matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21)

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute version (from the git tag on releases)
        id: ver
        run: |
          if [ "$IS_TAG" = "true" ]; then
            NAME="${GITHUB_REF_NAME#v}"                 # tag v1.2.0 -> 1.2.0
            IFS='.' read -r MA MI PA <<< "$NAME"
            CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))   # 1.2.0 -> 10200
            [ "$CODE" -gt 0 ] || CODE=1
          else
            # Dev (non-tag) builds mirror the local-build fallback in app/build.gradle.kts:
            # pinned HIGH so a dev APK always installs over any published release
            # (no INSTALL_FAILED_VERSION_DOWNGRADE) and the in-app updater stays quiet.
            NAME="99.99.99"
            CODE=99999
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME (code $CODE)"

      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          # Needed here, not just in the build step: the readability probe below opens the decoded
          # keystore, which is the only place a truncated secret or a wrong password is still
          # attributable to the secret rather than surfacing as an apksigner failure minutes later.
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Runs on every push (not just tags) so dev builds are also signed RELEASE builds —
          # required since R8 was enabled: only assembleRelease exercises shrinking/keep rules,
          # and a release-signed dev APK installs straight over a published release for testing.
          # Fork PRs have no secrets, so they fall back to a debug build below.
          if [ "${{ inputs.force_debug }}" = "true" ]; then
            echo "force_debug requested — building a debug-signed APK."
          elif [ -n "$KEYSTORE_BASE64" ]; then
            # tr -d strips CR/LF first: a secret pasted or piped in from Windows carries a trailing
            # \r, which is not valid base64, and `base64 -d` then dies with a bare "invalid input"
            # that names neither the secret nor the cause.
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/release.keystore" || {
              echo "::error::KEYSTORE_BASE64 is not valid base64. Regenerate it with:"
              echo "::error::  base64 -w0 release.keystore    (Linux/macOS)"
              echo "::error::  [Convert]::ToBase64String([IO.File]::ReadAllBytes('release.jks'))    (PowerShell)"
              exit 1
            }
            # A truncated secret decodes "successfully" into garbage; the build then fails much later
            # inside apksigner. Catch it here, where the message can still point at the secret.
            keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 || {
              echo "::error::The decoded keystore is unreadable — KEYSTORE_BASE64 is truncated, or KEYSTORE_PASSWORD is wrong."
              exit 1
            }
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "No KEYSTORE_BASE64 secret set — building a debug-signed APK."
          fi

      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Shared secret for the default metadata Worker's edge rule. Forks have no secret and
          # resolve "" — the app then falls back to the unprotected workers.dev base URL.
          OWNTV_EDGE_KEY: ${{ secrets.OWNTV_EDGE_KEY }}
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "Building signed release APKs (both ABI flavors)"
            ./gradlew assembleRelease --stacktrace
            # Product flavors split the output by flavor subfolder:
            #   standard/release  -> arm (arm64-v8a + armeabi-v7a) — the main download
            #   x86_64/release    -> x86_64 — emulator / rare x86 box
            ARM_SRC=$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)
            X86_SRC=$(ls app/build/outputs/apk/x86_64/release/*.apk | head -n1)
            echo "Built arm:    $ARM_SRC"
            echo "Built x86_64: $X86_SRC"
            echo "ARM_SRC=$ARM_SRC" >> "$GITHUB_ENV"
            echo "X86_SRC=$X86_SRC" >> "$GITHUB_ENV"
          else
            echo "Building debug APK"
            ./gradlew assembleDebug
            # Debug also builds both flavors; standard (arm) is the one most likely to be tested on a
            # real device. Surface it as the primary artifact; x86_64 debug is still in its folder.
            SRC=$(ls app/build/outputs/apk/standard/debug/*.apk | head -n1)
            echo "Built: $SRC"
            echo "ARM_SRC=$SRC" >> "$GITHUB_ENV"
          fi

      - name: Name the APK (OwnTV-v<version>)
        run: |
          mkdir -p dist
          if [ "$IS_TAG" = "true" ]; then
            OUT="OwnTV-v${{ steps.ver.outputs.name }}.apk"
          else
            OUT="OwnTV-dev-${GITHUB_SHA::7}.apk"
          fi
          cp "$ARM_SRC" "dist/$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          echo "Packaged dist/$OUT (arm: arm64-v8a + armeabi-v7a)"
          # Tag builds also ship a stable-named copy so a fixed URL always serves the latest signed
          # release: https://github.com/<repo>/releases/latest/download/OwnTV.apk
          # (used by the Fire TV Downloader code and any "always-latest" sideload link).
          if [ "$IS_TAG" = "true" ]; then
            cp "$ARM_SRC" "dist/OwnTV.apk"
            # Separate x86_64 build for emulators / rare Intel boxes. Pinned to the version only —
            # no always-latest copy, since real devices (the Downloader audience) don't need it.
            if [ -n "$X86_SRC" ]; then
              cp "$X86_SRC" "dist/OwnTV-x86_64-v${{ steps.ver.outputs.name }}.apk"
              echo "Packaged dist/OwnTV-x86_64-v${{ steps.ver.outputs.name }}.apk"
            fi
          fi

      # Gate the artifact on "will this actually install and launch on a Google TV Streamer 4K?".
      # That device is MediaTek MT8696 (4x Cortex-A55, 64-bit) running Google TV 14 / Android 14
      # (API 34), so every assertion below is checked against API 34 + arm64-v8a. A failure here
      # means the APK would be refused by the installer or hidden by the launcher — the exact
      # "the app isn't compatible with your TV" class of bug — so it must fail the job, not warn.
      - name: Verify Google TV Streamer 4K compatibility
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          AAPT2="$BT/aapt2"; APKSIGNER="$BT/apksigner"
          APK="dist/$APK_OUT"
          echo "Inspecting $APK with $(basename "$BT") build-tools"
          BADGING=$("$AAPT2" dump badging "$APK")
          # Field names verified against build-tools 36.0.0 (local) and 37.0.0 (this runner): both
          # print `minSdkVersion:`, NOT the `sdkVersion:` the older docs show, and both INDENT the
          # uses-feature lines under a `feature-group:` header. So the minSdk pattern must use the
          # real name and the feature patterns must not be anchored with ^ — get either wrong and
          # the checks silently match nothing and wave a broken APK through.
          echo "$BADGING" | grep -E "(^package:|^minSdkVersion|^targetSdkVersion|^native-code|launchable-activity|uses-feature)" || true

          fail() { echo "::error::Streamer 4K gate: $1"; exit 1; }

          # 1. ABI. The Streamer is arm64 (MT8696). A missing arm64-v8a slice is the single most
          #    common cause of an APK that installs everywhere else and not here.
          echo "$BADGING" | grep -q "native-code:.*'arm64-v8a'" \
            || fail "no arm64-v8a native slice — the Streamer 4K cannot run this APK"

          # 2. minSdk must be <= 34 (Android 14), targetSdk >= 23 (Android rejects lower outright).
          MIN=$(echo "$BADGING" | sed -n "s/^minSdkVersion:'\([0-9]*\)'.*/\1/p")
          TGT=$(echo "$BADGING" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")
          [ -n "$MIN" ] || fail "could not read minSdkVersion from badging — aapt2 output format changed"
          [ -n "$TGT" ] || fail "could not read targetSdkVersion from badging — aapt2 output format changed"
          [ "$MIN" -le 34 ] || fail "minSdk $MIN is above the Streamer's API 34"
          [ "$TGT" -ge 23 ] || fail "targetSdk $TGT is below 23; Android 14 blocks the install"

          # 3. Nothing may be *required* that the Streamer lacks. It has no touchscreen, and a
          #    required leanback feature has historically hidden apps from non-certified launchers.
          #    Required features print as `uses-feature:`; `uses-feature-not-required:` is the safe
          #    form. Match on the colon to keep the two apart despite the shared prefix.
          REQUIRED=$(echo "$BADGING" | grep -oE "uses-feature: name='[^']*'" | grep -E "touchscreen|telephony|camera" || true)
          [ -z "$REQUIRED" ] || fail "a feature the Streamer lacks is marked required: $REQUIRED"

          # 4. It has to show up on the Google TV launcher at all. aapt2 emits a dedicated
          #    `leanback-launchable-activity:` line when LEANBACK_LAUNCHER is present, which is a
          #    far more direct signal than grepping the decoded manifest tree.
          echo "$BADGING" | grep -q "leanback-launchable-activity:" \
            || fail "no LEANBACK_LAUNCHER activity — the app would be invisible on Google TV"

          # 5. Signature scheme. Android 11+ refuses to install an APK that only carries the
          #    legacy v1 JAR signature when targetSdk >= 30, so v2 (or v3) must be present.
          VERIFY=$("$APKSIGNER" verify --verbose "$APK")
          echo "$VERIFY"
          echo "$VERIFY" | grep -qE "\(APK Signature Scheme v[23]\).*true" \
            || fail "APK is not signed with signature scheme v2/v3 — Android 14 would refuse it"

          echo "✅ Google TV Streamer 4K gate passed (arm64-v8a, minSdk $MIN, targetSdk $TGT, leanback launcher, v2+ signed)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          # Upload the whole dist/ so both the arm APK and the x86_64 APK are captured.
          name: ${{ env.APK_OUT }}
          path: dist/*
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG_APP.md
        if: env.IS_TAG == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The release body is what the in-app updater shows as "What's new", so it must be the
          # SHORT, bullet-only notes from CHANGELOG_APP.md — never CHANGELOG.md, which is the long
          # developer/contributor changelog and is read manually on GitHub.
          #
          # This runs here rather than only in release-notes.yml because a release published by
          # GITHUB_TOKEN does not trigger other workflows, so that job never fires for tag builds.
          # It stays as a fallback for releases published by hand from the GitHub UI.
          #
          # Take "## <tag>" up to the next "## v" header; the header may carry a date/"unreleased"
          # tail ("## v4.1.5 — 2026-07-26") or nothing at all, so match the version as a whole word.
          if [ -f CHANGELOG_APP.md ]; then
            awk -v ver="$TAG" '
              $0 ~ ("^## " ver "([ \t]|$)") { flag=1; next }
              /^## v/ && flag { flag=0 }
              flag { print }
            ' CHANGELOG_APP.md > dist/RELEASE_NOTES.md || true
            # Trim leading/trailing blank lines.
            sed -i -e '/./,$!d' dist/RELEASE_NOTES.md
            awk 'NF{p=NR} {a[NR]=$0} END{for(i=1;i<=p;i++) print a[i]}' \
              dist/RELEASE_NOTES.md > dist/RELEASE_NOTES.trimmed.md
            mv dist/RELEASE_NOTES.trimmed.md dist/RELEASE_NOTES.md
          fi
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "::warning::No CHANGELOG_APP.md section for $TAG — publishing a placeholder body."
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md) for details." \
              > dist/RELEASE_NOTES.md
          fi
          echo "--- Release notes ---"
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: OwnTV ${{ github.ref_name }}
          # A glob, not an explicit list: without KEYSTORE_BASE64 the x86_64 APK is never built,
          # and naming it here made every unsigned tag build emit an unmatched-file warning and
          # publish a release whose asset list didn't match what was actually produced.
          files: dist/*.apk
          fail_on_unmatched_files: true
          body_path: dist/RELEASE_NOTES.md
          # Must stay false: it appends GitHub's auto commit/PR list under the body, which buries the
          # short in-app notes the updater dialog shows.
          generate_release_notes: false
